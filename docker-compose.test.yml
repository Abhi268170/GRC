# Automated tests, in containers, against a throwaway Postgres and Redis. Nothing here touches
# the development or production data.
#
#   docker compose -f docker-compose.test.yml run --rm backend-tests
#   docker compose -f docker-compose.test.yml run --rm ai-service-tests
#   docker compose -f docker-compose.test.yml down -v
name: grc-test

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    environment:
      POSTGRES_USER: grc
      POSTGRES_PASSWORD: test-only
      POSTGRES_DB: postgres
    command: ["postgres", "-c", "max_connections=300", "-c", "fsync=off"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grc"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.6.8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend-tests:
    build:
      context: ./backend
      additional_contexts:
        contracts: ./packages/ai_contracts
      args:
        INSTALL_DEV: "true"
    command: ["pytest", "-q", "-p", "no:cacheprovider", "tests"]
    environment:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://grc:test-only@postgres:5432/grc_test
      REDIS_URL: redis://redis:6379/0
      S3_ACCESS_KEY: unused
      S3_SECRET_KEY: unused
      JWT_SECRET: test-secret-that-is-long-enough-for-the-check
      SUPER_ADMIN_EMAIL: admin@test.example
      SUPER_ADMIN_PASSWORD: admin-password-for-tests
      AI_SERVICE_URL: http://ai-service.invalid:8100
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/tests:/app/tests
      - ./packages/ai_contracts/ai_contracts:/app/ai_contracts
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  ai-service-tests:
    build:
      context: ./ai-service
      additional_contexts:
        contracts: ./packages/ai_contracts
      args:
        INSTALL_DEV: "true"
    command: ["pytest", "-q", "-p", "no:cacheprovider", "tests"]
    environment:
      ENVIRONMENT: test
      AI_SERVICE_TOKEN: test-token
    volumes:
      - ./ai-service/app:/app/app
      - ./ai-service/tests:/app/tests
      - ./packages/ai_contracts/ai_contracts:/app/ai_contracts
