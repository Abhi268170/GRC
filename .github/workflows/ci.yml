# Runs on every push and pull request once the repository has a remote on GitHub.
# The same commands work locally: see "Checks" in README.md.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: |
          pipx install ruff
          ruff check backend ai-service packages scripts
      - name: Backend tests
        run: docker compose -f docker-compose.test.yml run --rm --build backend-tests
      - name: AI service tests
        run: docker compose -f docker-compose.test.yml run --rm --build ai-service-tests
      - name: Images build
        run: docker compose -f docker-compose.yml build backend ai-service

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npm run build
