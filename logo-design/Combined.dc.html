<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TrustUp combined logo</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#4D7C0F}a:hover{color:#365314}
</style>
</helmet>
<div style="width: 1200px; height: 720px; box-sizing: border-box; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: 440px 280px; font-family: Inter, sans-serif; background: #F7FAF2; color: #10190A">

<div style="grid-column: span 3; background: #10190A; display: flex; justify-content: center; align-items: center; position: relative">
<div style="display: flex; align-items: center; gap: 24px">
<svg width="150" height="150" viewBox="0 0 64 64" role="img" aria-label="TrustUp mark: two links joined on an upward diagonal">
<g transform="rotate(-45 32 32)">
<rect x="5" y="23" width="32" height="18" rx="9" fill="none" stroke="#F7FAF2" stroke-width="5.5"></rect>
<rect x="27" y="23" width="32" height="18" rx="9" fill="none" stroke="{{accent}}" stroke-width="5.5"></rect>
</g>
</svg>
<div style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 132px; letter-spacing: -5px; line-height: 1; color: #F7FAF2">trust<span style="color: {{accent}}">up</span></div>
</div>
<span style="position: absolute; left: 40px; top: 32px; font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #9FB08F">Combined · C mark + D wordmark · on ink</span>
</div>

<div style="background: #FFFFFF; border-right: 1px solid #E3EAD9; display: flex; justify-content: center; align-items: center; position: relative">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="60" height="60" viewBox="0 0 64 64" aria-hidden="true">
<g transform="rotate(-45 32 32)">
<rect x="5" y="23" width="32" height="18" rx="9" fill="none" stroke="#10190A" stroke-width="5.5"></rect>
<rect x="27" y="23" width="32" height="18" rx="9" fill="none" stroke="{{accent}}" stroke-width="5.5"></rect>
</g>
</svg>
<div style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 50px; letter-spacing: -2px; line-height: 1; color: #10190A">trust<span style="color: #4D7C0F">up</span></div>
</div>
<span style="position: absolute; left: 28px; top: 24px; font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #5E6B54">On white</span>
</div>

<div style="background: {{accent}}; display: flex; justify-content: center; align-items: center; position: relative">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="60" height="60" viewBox="0 0 64 64" aria-hidden="true">
<g transform="rotate(-45 32 32)">
<rect x="5" y="23" width="32" height="18" rx="9" fill="none" stroke="#10190A" stroke-width="5.5"></rect>
<rect x="27" y="23" width="32" height="18" rx="9" fill="none" stroke="#F7FAF2" stroke-width="5.5"></rect>
</g>
</svg>
<div style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 50px; letter-spacing: -2px; line-height: 1; color: #10190A">trustup</div>
</div>
<span style="position: absolute; left: 28px; top: 24px; font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #253514">On lime</span>
</div>

<div style="background: #F7FAF2; display: flex; justify-content: center; align-items: center; gap: 28px; position: relative">
<svg width="120" height="120" viewBox="0 0 100 100" role="img" aria-label="TrustUp app icon">
<rect width="100" height="100" rx="23" fill="#10190A"></rect>
<g transform="translate(18 18) rotate(-45 32 32)">
<rect x="5" y="23" width="32" height="18" rx="9" fill="none" stroke="#F7FAF2" stroke-width="5.5"></rect>
<rect x="27" y="23" width="32" height="18" rx="9" fill="none" stroke="{{accent}}" stroke-width="5.5"></rect>
</g>
</svg>
<svg width="48" height="48" viewBox="0 0 100 100" aria-hidden="true">
<rect width="100" height="100" rx="23" fill="#10190A"></rect>
<g transform="translate(18 18) rotate(-45 32 32)">
<rect x="5" y="23" width="32" height="18" rx="9" fill="none" stroke="#F7FAF2" stroke-width="7"></rect>
<rect x="27" y="23" width="32" height="18" rx="9" fill="none" stroke="{{accent}}" stroke-width="7"></rect>
</g>
</svg>
<span style="position: absolute; left: 28px; top: 24px; font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #5E6B54">App icon</span>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#A3E635","options":["#A3E635","#84CC16","#BEF264","#C6F432"]},"$preview":{"width":1200,"height":720}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#A3E635' };
}
}
</script>
</body>
</html>
