[project]
name = "grc-backend"
version = "0.1.0"
description = "AI-powered GRC platform - API and worker"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "python-multipart>=0.0.18",
    "arq>=0.26",
    "boto3>=1.35",
    "pgvector>=0.3.6",
    "pyjwt>=2.10",
    "pwdlib[argon2]>=0.2.1",
    "anthropic>=2.12",
    "python-docx>=1.1",
    "pypdf>=5.1",
    "openpyxl>=3.1",
    "reportlab>=4.2",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.28", "ruff>=0.8"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
asyncio_mode = "auto"
